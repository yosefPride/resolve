[package]
name = "resolve"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
mongodb = "3"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
jsonwebtoken = "9"
rand = "0.9"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
