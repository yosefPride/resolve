<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/brand-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resolve</title>
    <!-- Display face for the marketing headlines (Tailwind's `font-display`,
         registered in main.css). Body copy stays on the system sans stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Matches the public routes, which are what an unauthenticated visitor
         lands on. Set here so the first paint is right before React mounts;
         the layouts own the background from then on. -->
    <style>
      body {
        background-color: #000000;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
